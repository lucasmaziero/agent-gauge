[project]
name = "agent-gauge"
version = "2.0.3"
description = "Floating desktop widget showing coding-agent rate-limit usage"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lucas Maziero" }]
keywords = ["claude-code", "codex", "rate-limit", "usage", "widget", "tray"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "pyside6-essentials>=6.7",
    # Verification through the OS rather than OpenSSL's own store: Windows
    # fetches missing roots on demand and OpenSSL cannot, so without this a
    # perfectly ordinary host fails on one machine and works on the next.
    "truststore>=0.9",
]

[project.scripts]
agent-gauge = "agent_gauge.app:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.6"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gauge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "tools"]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # flake8-simplify
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# Qt's C++ API names are camelCase; overriding them is not a style choice.
"src/agent_gauge/widget.py" = ["N802"]
"src/agent_gauge/panel.py" = ["N802"]
